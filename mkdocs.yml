site_name: MeshCore Canada
site_url: https://meshcore.ca
site_description: Practical, community-reviewed guidance for joining and operating MeshCore networks in Canada.
repo_name: MeshCore Canada
repo_url: https://github.com/MeshCore-ca/MeshCore-Canada
edit_uri: edit/main/docs/
use_directory_urls: true
copyright: >-
  Community-run documentation for MeshCore users in Canada. Not affiliated with the upstream MeshCore project.<br>
  Agentic tools help create and maintain this site. Only content reviewed and approved by people is published.

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/MeshCore-Canada-Favicon.svg
  logo: assets/MeshCore-Canada-Mark.svg
  font: false
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use light theme
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Use dark theme
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - assets/styles/tokens.css?v=20260926-1
  - assets/styles/base.css?v=20261105-1
  - assets/styles/shell.css?v=20261105-1
  - assets/styles/components.css?v=20260926-1
  - assets/styles/network-status.css?v=20260905-1

extra_javascript:
  - assets/javascripts/region-profile.js?v=20261105-2
  - assets/javascripts/i18n-runtime.js?v=20260829-1
  - assets/javascripts/bootstrap.js?v=20261106-1
  - assets/javascripts/network-status.js?v=20260905-1

extra:
  github_stars: 19
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/GBCP4xdgNv
      name: MeshCore Canada Discord
    - icon: fontawesome/solid/comments
      link: https://forum.meshcore.ca/
      name: MeshCore Canada forum
    - icon: material/access-point-network
      link: https://live.meshcore.ca/
      name: Live MeshCore Canada network tools
    - icon: fontawesome/brands/github
      link: https://github.com/MeshCore-ca/MeshCore-Canada
      name: MeshCore Canada on GitHub

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: Des guides pratiques, relus par la communauté, pour rejoindre et exploiter les réseaux MeshCore au Canada.
          copyright: >-
            Documentation communautaire pour les utilisateurs de MeshCore au Canada. Sans affiliation avec le projet MeshCore principal.<br>
            Des agents d’IA contribuent à créer et à maintenir ce site. Seul le contenu relu et approuvé par des personnes est publié.
          theme:
            palette:
              - scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-7
                  name: Utiliser le thème clair
              - scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/brightness-4
                  name: Utiliser le thème sombre
          nav_translations:
