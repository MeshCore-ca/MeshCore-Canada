name: Legacy census boundary application (retired)

# Closing an old boundary issue must never publish a competing census map.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the replacement
        run: |
          echo 'MeshMapper owns the current IATA zone boundaries.'
          echo 'Legacy census-cell proposals are retained as history and are not applied.'
          echo 'Review zone updates in MeshMapper, then refresh the repository snapshot through a PR.'
